# FDAS单容器部署方案 - Supervisor配置
# 管理PostgreSQL、FastAPI、Nginx进程

[supervisord]
nodaemon=true
logfile=/var/log/fdas/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/fdas
loglevel=info

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

# ==================== PostgreSQL服务 ====================
[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
stdout_logfile=/var/log/fdas/postgresql.log
stderr_logfile=/var/log/fdas/postgresql_error.log
environment=PGDATA="/var/lib/postgresql/data",PGPORT="5432"

# ==================== 数据库初始化（仅首次） ====================
[program:db_init]
command=/opt/fdas/scripts/init-database.sh
user=root
autostart=true
autorestart=false
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/fdas/db_init.log
stderr_logfile=/var/log/fdas/db_init_error.log
depends_on=postgresql
exitcodes=0,1

# ==================== FastAPI后端服务 ====================
[program:fdas_backend]
command=/usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/opt/fdas/backend
user=fdas-backend
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/var/log/fdas/backend.log
stderr_logfile=/var/log/fdas/backend_error.log
environment=DATABASE_URL="postgresql+asyncpg://fdas:fdas@localhost:5432/fdas",SESSION_SECRET="%(ENV_SESSION_SECRET)s",DEBUG="%(ENV_DEBUG)s",ALLOWED_ORIGINS="%(ENV_ALLOWED_ORIGINS)s"
depends_on=db_init

# ==================== Nginx前端服务 ====================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/fdas/nginx.log
stderr_logfile=/var/log/fdas/nginx_error.log
depends_on=fdas_backend