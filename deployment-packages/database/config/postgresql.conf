# FDAS PostgreSQL配置模板
# 生产环境推荐配置

# ==================== 连接设置 ====================
# 最大连接数
max_connections = 100

# 超级用户保留连接数
superuser_reserved_connections = 3

# ==================== 内存设置 ====================
# 共享内存缓冲区（建议设为系统内存的25%）
shared_buffers = 256MB

# 工作内存（每个操作）
work_mem = 64MB

# 维护工作内存
maintenance_work_mem = 256MB

# ==================== WAL设置 ====================
# WAL缓冲区
wal_buffers = 64MB

# 检查点间隔
checkpoint_completion_target = 0.9

# ==================== 查询优化 ====================
# 有效缓存大小（建议设为系统内存的50%）
effective_cache_size = 512MB

# 随机页面成本（SSD可设为1.0）
random_page_cost = 1.1

# ==================== 日志设置 ====================
# 日志级别
log_min_duration_statement = 1000

# 记录慢查询
log_checkpoints = on
log_connections = on
log_disconnections = on

# ==================== 时间戳设置 ====================
# 使用UTC时间
timezone = 'UTC'

# ==================== 监听设置 ====================
# 监听地址（容器内使用localhost）
listen_addresses = '*'

# 端口
port = 5432